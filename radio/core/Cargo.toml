[package]
name = "pyrate-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
ed25519-dalek = "3"
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", features = ["use-std"] }
bip39 = "3"
getrandom = "0.3"
opus = { version = "0.4", optional = true }
symphonia = { version = "0.6", optional = true, features = ["all-codecs", "all-formats"] }
rubato = { version = "5", optional = true }
thiserror = "2"
serde_json = "1"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
curve25519-dalek = "4"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
ebur128 = { version = "0.1", optional = true }

[features]
default = ["codec"]
# Encoding, decoding and reading audio files. The browser build leaves it out and decodes
# with the browser's own Opus.
codec = ["dep:opus", "dep:symphonia", "dep:rubato", "dep:ebur128"]

[dev-dependencies]
postcard = { version = "1.1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
