name: pyrate
description: "Pyrate Radio. Every install a station, a carrier and a relay. No rights reserved."
publish_to: 'none'
version: 0.9.16+38

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  path_provider: ^2.1.0
  file_picker: ^10.0.0
  # Computers: the tray icon, and the window that closes into it (lib/tray.dart).
  tray_manager: ^0.5.3
  window_manager: ^0.5.1

flutter:
  uses-material-design: true
  assets:
    - assets/bootstrap.txt
    - assets/harbour.txt
    - assets/open_players.txt
    - assets/release_keys.txt
    - assets/chart.json
    - assets/brand/
    - assets/stations/
    # The open player, for the computers to share and save (tools/open_player.py --tar).
    - path: assets/player/
      platforms: [windows, macos, linux]
    # The tray's icon: a .ico on Windows, a template for the Mac's menu bar.
    - path: assets/tray/
      platforms: [windows, macos, linux]
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Regular.ttf
        - asset: assets/fonts/Cinzel-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cinzel-Black.ttf
          weight: 900
    - family: Pica
      fonts:
        - asset: assets/fonts/IMFellDWPicaSC-Regular.ttf
    - family: Skull
      fonts:
        - asset: assets/fonts/NotoSansSymbols2-Skull.ttf
    - family: Fell
      fonts:
        - asset: assets/fonts/IMFellEnglish-Regular.ttf
        - asset: assets/fonts/IMFellEnglish-Italic.ttf
          style: italic
    - family: FellSC
      fonts:
        - asset: assets/fonts/IMFellEnglishSC-Regular.ttf
    - family: Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
