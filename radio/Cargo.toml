[workspace]
resolver = "3"
members = ["core", "node", "ffi", "spike", "browser"]

[workspace.package]
edition = "2024"
license = "CC0-1.0"
publish = false

[profile.release]
lto = "thin"
strip = true

# The browser build: small over fast, and keeps the sections wasm-bindgen reads.
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = false
debug = false
panic = "abort"
