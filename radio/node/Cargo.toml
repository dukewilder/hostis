[package]
name = "pyrate-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pyrate-core = { path = "../core" }
iroh = { version = "1.4", features = ["platform-verifier"] }
iroh-gossip = "0.102"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1", features = ["use-std"] }
blake3 = "1.8"
anyhow = "1"
futures-lite = "2"
cpal = { version = "0.16", optional = true }
tracing = "0.1"
axum = "0.8"
mp3lame-encoder = "0.3"
iroh-relay = { version = "1.4", features = ["server"] }

[features]
default = []
playback = ["dep:cpal"]
