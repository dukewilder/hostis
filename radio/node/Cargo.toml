[package]
name = "pyrate-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
socket2 = { version = "0.6", features = ["all"] }
zeroize = "1"
pyrate-core = { path = "../core" }
iroh = { version = "1.4", features = ["platform-verifier"] }
# aws-lc-rs for the hybrid post-quantum key exchange (X25519 with ML-KEM-768), which ring lacks.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12"] }
iroh-gossip = "0.102"
n0-future = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1", features = ["use-std"] }
blake3 = "1.8"
anyhow = "1"
futures-lite = "2"
cpal = { version = "0.16", optional = true }
tracing = "0.1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
curve25519-dalek = "4"
sha2 = "0.10"
rand = "0.8"
axum = "0.8"
mp3lame-encoder = "0.3"
iroh-relay = { version = "1.4", features = ["server"] }
qrcode = { version = "0.14", default-features = false }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }

p256 = { version = "0.14", features = ["ecdsa", "pkcs8"], optional = true }
rcgen = { version = "0.14", default-features = false, features = ["ring"], optional = true }

[features]
default = []
playback = ["dep:cpal"]
# The offline key tool's Android signing, kept out of the app and the Lantern.
keytool = ["dep:p256", "dep:rcgen"]

[[bin]]
name = "release"
path = "src/bin/release/main.rs"
required-features = ["keytool"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
