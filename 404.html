:root{
  --black:#030303;
  --bone:#ede4ce;
  --bone-dim:rgba(237,228,206,.82);
  --blood:#c52828;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--black);color:var(--bone)}
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:4rem 1.25rem 3rem;background:var(--black);
  color:var(--bone);font-family:'IM Fell English',Georgia,serif;-webkit-font-smoothing:antialiased}
.sigil{font-family:'Noto Sans Symbols 2','Apple Symbols','Segoe UI Symbol',serif;
  font-size:clamp(96px,16vw,150px);line-height:1;color:var(--bone);user-select:none}
.code{margin-top:1.6rem;font-family:'JetBrains Mono','Courier New',monospace;font-size:.72rem;
  letter-spacing:.38em;color:var(--blood);text-transform:uppercase}
h1{margin-top:.9rem;font-family:'IM Fell DW Pica SC',Georgia,serif;font-weight:400;
  font-size:clamp(2rem,6vw,3.4rem);letter-spacing:.06em;line-height:1.05}
.line{margin-top:1rem;font-style:italic;font-size:clamp(1.02rem,2.2vw,1.2rem);color:var(--bone-dim)}
nav{margin-top:2.2rem;display:flex;gap:.9rem;justify-content:center;flex-wrap:wrap;
  font-family:'JetBrains Mono','Courier New',monospace;font-size:.72rem;letter-spacing:.2em}
nav a{color:var(--bone);text-decoration:none;border:1px solid rgba(237,228,206,.26);padding:.5rem .9rem;
  transition:color .18s,border-color .18s,background .18s}
nav a::before{content:"\203A";margin-right:.5rem;color:var(--blood);font-family:Georgia,serif;letter-spacing:0}
nav a:hover,nav a:focus-visible{color:var(--black);background:var(--bone);border-color:var(--bone);outline:none}
nav a:hover::before,nav a:focus-visible::before{color:var(--black)}
/* Footer lines. Identical across the sheets. */
footer{margin-top:3.5rem}
footer .f-contact,
footer .f-copy,
footer .f-source{margin:1rem 0 0;font-family:'JetBrains Mono','Courier New',monospace;font-size:.76rem;
  letter-spacing:.1em;line-height:1.7;color:rgba(237,228,206,.55);text-transform:none}
footer .f-contact{margin-top:0}
footer .f-contact a,
footer .f-source a{color:rgba(237,228,206,.82);text-decoration:none;
  border-bottom:1px solid rgba(237,228,206,.22);transition:color .2s ease,border-color .2s ease}
footer .f-contact a:hover,
footer .f-source a:hover{color:#c52828;border-color:#c52828}
</style>
