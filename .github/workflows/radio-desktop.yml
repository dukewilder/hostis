# Builds Pyrate Radio for computers from the radio branch: Windows, macOS and Linux. The
# builds are ordinary and reproducible from the public source; nothing secret goes in, and the
# results are published on hostis.black/pyrateradio with their checksums and torrents.
# No rights reserved.
name: radio desktop
on:
  push:
    branches: [radio]
    paths: ["radio/tools/desktop/**", "radio/app/**", "radio/core/**", "radio/node/**", "radio/ffi/**", "radio/tools/open_player.py", ".github/workflows/radio-desktop.yml"]
  workflow_dispatch:
permissions:
  contents: read
# A newer push supersedes a build still running.
concurrency:
  group: radio-desktop
  cancel-in-progress: true
jobs:
  # Every dependency checked against the RustSec advisories, and the Opus files the browser
  # player ships checked against their recorded fingerprints, before anything is built.
  audit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: radio } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo install cargo-audit --version 0.23.0 --locked
      - run: cargo audit
      - run: python3 tools/vendor_check.py
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: radio } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { channel: stable, flutter-version: "3.47.9" }
      - run: cargo build --release --locked -p pyrate-ffi
      # The open player rides in the app, for sharing on a Wi-Fi and saving to a folder: the one
      # this app names, fetched from IPFS or the site's CAR and checked block by block.
      - run: python tools/open_player.py --tar app/assets/player/open-player.tar --need
        env: { PYRATE_PLAYER_CARS: "https://hostis.black/pyrateradio/ipfs" }
      # The build's own version code, so the app can tell when a newer one is signed.
      - shell: bash
        run: |
          flutter build windows --release --dart-define=PYRATE_CODE=$(sed -n 's/^version: .*+\([0-9]*\)$/\1/p' pubspec.yaml)
        working-directory: radio/app
      - name: Pack
        shell: pwsh
        run: |
          $out = "app/build/windows/x64/runner/Release"
          Copy-Item target/release/pyrate_ffi.dll $out -Force
          Copy-Item "tools/desktop/Pyrate Radio with a log.bat" $out -Force
          Compress-Archive -Path "$out/*" -DestinationPath pyrate-radio-windows.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: pyrate-radio-windows, path: radio/pyrate-radio-windows.zip }
      # The release tool for the key holders and for signing APKs (HOLDERS.md, RELEASES.md).
      - run: cargo build --release --locked -p pyrate-node --bin release --features keytool
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: pyrate-release-tool-windows, path: radio/target/release/release.exe }
  macos:
    runs-on: macos-latest
    defaults: { run: { working-directory: radio } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { channel: stable, flutter-version: "3.47.9" }
      - run: brew install cmake || true
      - run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked -p pyrate-ffi --target aarch64-apple-darwin
          cargo build --release --locked -p pyrate-ffi --target x86_64-apple-darwin
          lipo -create -output libpyrate_ffi.dylib target/aarch64-apple-darwin/release/libpyrate_ffi.dylib target/x86_64-apple-darwin/release/libpyrate_ffi.dylib
          install_name_tool -id @rpath/libpyrate_ffi.dylib libpyrate_ffi.dylib
      # The open player rides in the app, for sharing on a Wi-Fi and saving to a folder: the one
      # this app names, fetched from IPFS or the site's CAR and checked block by block.
      - run: python3 tools/open_player.py --tar app/assets/player/open-player.tar --need
        env: { PYRATE_PLAYER_CARS: "https://hostis.black/pyrateradio/ipfs" }
      # The build's own version code, so the app can tell when a newer one is signed.
      - shell: bash
        run: |
          flutter build macos --release --dart-define=PYRATE_CODE=$(sed -n 's/^version: .*+\([0-9]*\)$/\1/p' pubspec.yaml)
        working-directory: radio/app
      - name: Pack
        run: |
          APP="app/build/macos/Build/Products/Release/Pyrate Radio.app"
          mkdir -p "$APP/Contents/Frameworks"
          cp libpyrate_ffi.dylib "$APP/Contents/Frameworks/"
          # Signed by nobody: an ad-hoc signature only, so macOS will run it after one right-click Open.
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" pyrate-radio-macos.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: pyrate-radio-macos, path: radio/pyrate-radio-macos.zip }
  linux:
    runs-on: ubuntu-22.04
    defaults: { run: { working-directory: radio } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { channel: stable, flutter-version: "3.47.9" }
      # libayatana-appindicator3-dev: the tray icon that keeps the radio running with its window closed.
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libayatana-appindicator3-dev
      - run: cargo build --release --locked -p pyrate-ffi
      # The open player rides in the app, for sharing on a Wi-Fi and saving to a folder: the one
      # this app names, fetched from IPFS or the site's CAR and checked block by block.
      - run: python3 tools/open_player.py --tar app/assets/player/open-player.tar --need
        env: { PYRATE_PLAYER_CARS: "https://hostis.black/pyrateradio/ipfs" }
      # The build's own version code, so the app can tell when a newer one is signed.
      - shell: bash
        run: |
          flutter build linux --release --dart-define=PYRATE_CODE=$(sed -n 's/^version: .*+\([0-9]*\)$/\1/p' pubspec.yaml)
        working-directory: radio/app
      - name: Pack
        run: |
          B=app/build/linux/x64/release/bundle
          cp app/linux/pyrate-radio.png "$B/"
          cp app/linux/pyrate-radio.desktop "$B/"
          tar -C "$B/.." -czf pyrate-radio-linux-x64.tar.gz --transform 's,^bundle,pyrate-radio,' bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: pyrate-radio-linux, path: radio/pyrate-radio-linux-x64.tar.gz }
  # A signed statement that these four files came from this workflow run on this commit, kept
  # by GitHub and checked with: gh attestation verify <file> --repo <owner>/<repo>. Only this
  # job may write attestations and mint the identity token; the builds above stay read-only.
  attest:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: dist, pattern: "pyrate-*", merge-multiple: true }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/pyrate-radio-windows.zip
            dist/pyrate-radio-macos.zip
            dist/pyrate-radio-linux-x64.tar.gz
            dist/release.exe
